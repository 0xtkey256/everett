[project]
name = "everett"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["daytona>=0.232", "pydantic>=2.6", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "sse-starlette>=2.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
